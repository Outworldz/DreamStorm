# <FS:Outworldz> Linux and macOS builds of the Water (sea waves) branch.
# Open-source libraries only (ReleaseFS_open: no FMOD, no KDU, no private
# packages or signing secrets). Start it by hand from the Actions tab; give a
# release tag to attach the results to that GitHub release.
name: DreamStorm build (Linux, macOS)
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to attach the builds to (empty = artifacts only)'
        required: false
        default: ''
permissions:
  contents: write
env:
  AUTOBUILD_VARIABLES_FILE: ${{ github.workspace }}/build-variables/variables
  XZ_DEFAULTS: -T0

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-24.04", "macos-15"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Bash 4 and GNU sed (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install bash gnu-sed
          echo "$(brew --prefix)/bin" >> $GITHUB_PATH
          echo "$(brew --prefix)/opt/gnu-sed/libexec/gnubin" >> $GITHUB_PATH

      - name: Get the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build variables
        uses: actions/checkout@v4
        with:
          repository: FirestormViewer/fs-build-variables
          path: build-variables

      - name: Python
        id: py
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Python requirements
        run: |
          echo "PYTHON=${{ steps.py.outputs.python-path }}" >> $GITHUB_ENV
          python -m pip install -r requirements.txt
        shell: bash

      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          swap-storage: false

      - name: Packages and GCC 14 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # same list as upstream build_viewer.yml (7.3 needs libvlc-dev, wayland, pipewire, gstreamer...)
          sudo apt-get install -y gcc-14 g++-14 python3-setuptools pkg-config ninja-build mesa-common-dev \
            libgl1-mesa-dev libglu1-mesa-dev libosmesa6-dev libxinerama-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxft-dev libpulse-dev libunwind-dev libpipewire-0.3-dev libdbus-1-dev libglib2.0-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libvlc-dev libwayland-dev libfreetype6-dev \
            libfontconfig1-dev
          echo "CC=gcc-14" >> $GITHUB_ENV
          echo "CXX=g++-14" >> $GITHUB_ENV

      - name: Configure
        run: autobuild configure -c ReleaseFS_open -A64 -- --package --chan DreamStorm -DLL_TESTS:BOOL=FALSE
        shell: bash

      - name: Build
        run: autobuild build -c ReleaseFS_open -A64 --no-configure
        shell: bash

      # 7.3 viewer_manifest.py writes the Linux tar to RUNNER_TEMP on GitHub runners
      - name: Fetch the Linux tar
        if: runner.os == 'Linux'
        run: mv "$RUNNER_TEMP"/*.tar.xz build-linux-*/newview/
        shell: bash

      - name: List results
        run: ls -la build-*/newview/*.xz build-*/newview/*.dmg 2>/dev/null || ls -la build-*/newview
        shell: bash

      - name: Upload artifacts (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: DreamStorm-linux
          path: build-linux-*/newview/*.tar.xz

      - name: Upload artifacts (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: DreamStorm-macos
          path: build-darwin-*/newview/*.dmg

      - name: Attach to release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(ls build-linux-*/newview/*.tar.xz build-darwin-*/newview/*.dmg 2>/dev/null || true)
          gh release upload "${{ inputs.release_tag }}" $files --clobber
        shell: bash
